name: Changelog

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'

jobs:
name: Changelog

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Genera CHANGELOG.md
        run: |
          {
            echo "# 📜 Changelog — Registro Neonato"
            echo
            echo "_Generato automaticamente dai commit su \`main\`: ogni push aggiorna questo file._"
            echo
            echo "Per l'APK di ogni versione vedi [Releases](../../releases)."
            echo
            git log --no-merges --pretty=format:'- **%ad** — %s' --date=short
            echo
          } > CHANGELOG.md

      - name: Commit e push del changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG già aggiornato, niente da fare."
          else
            git commit -m "chore: aggiorna CHANGELOG [skip ci]"
            git push
          fi
