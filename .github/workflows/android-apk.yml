name: Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install --no-audit --no-fund

      - name: Ensure Android platform and sync
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Copy custom icons
        run: |
          if [ -d icon-assets/res ]; then
            cp -rf icon-assets/res/. android/app/src/main/res/
          elif [ -d icon-assets ]; then
            cp -rf icon-assets/. android/app/src/main/res/
          fi

      - name: Set versionCode and versionName
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Setup stable signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/registro-neonato.keystore"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/registro-neonato.keystore" >> "$GITHUB_ENV"
            cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  stable {
                      storeFile file(System.getenv("KEYSTORE_PATH"))
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.stable
                  }
              }
          }
          EOF
            echo "Firma stabile attiva."
          else
            echo "Nessun keystore nei segreti: uso la firma debug temporanea."
          fi

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk registro-neonato.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: registro-neonato-apk
          path: registro-neonato.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Registro Neonato 🍼 v1.0.${{ github.run_number }}
          body: |
            ## Come si installa
            1. Scarica il file `registro-neonato.apk` qui sotto.
            2. Sul telefono consenti l'installazione da questa fonte.
            3. Apri l'app e inizia a registrare.

            ## Aggiornamenti automatici
            Con [Obtainium](https://github.com/ImranR98/Obtainium) l'app si aggiorna con un tocco.
          make_latest: true
          files: registro-neonato.apk
